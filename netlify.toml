[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # Include the assets folder so functions can read image files at runtime
  # assets/images/** = original source images (referenced by data-pimg with assets/images/ prefix)
  # assets/*.avif etc = hashed Vite build output images (referenced by data-pimg with assets/ prefix)
  included_files = ["assets/images/**", "assets/*.avif", "assets/*.webp", "assets/*.jpg", "assets/*.jpeg", "assets/*.png", "assets/*.gif"]

# Environment variables — IMPORTANT: replace the secret value below with a strong random string,
# or (better) set IMG_SECRET in the Netlify dashboard under Site Settings > Environment Variables
# and remove it from this file so it is not committed to git.
[build.environment]
  IMG_SECRET = "darTY4RT6Ye4354PO43ILER2SRSFS536re"

# Block direct access to assets/images — must go through the function
[[redirects]]
  from = "/assets/images/*"
  to = "/404"
  status = 404
  force = true

# Block direct access to hashed image files in /assets/ (Vite build output)
[[redirects]]
  from = "/assets/*.avif"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/assets/*.webp"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/assets/*.jpg"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/assets/*.jpeg"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/assets/*.png"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
