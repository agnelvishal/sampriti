[build]
  command = "npm run build"
  publish = "dist"

# Asset optimization is enabled by default in Netlify dashboard,
# but using a build tool provides better control and local parity.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
