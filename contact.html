<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sampriti Botanicals</title>
    <link rel="icon" type="image/png" href="assets/images/logo-trans.png">

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Contact Sampriti Botanicals. Get in touch with us for inquiries about our sacred Indian herbal formulations.">
    <meta name="keywords" content="Contact, Sampriti, Botanicals, Herbal, Ayurveda, India">
    <meta name="author" content="Sampriti Botanicals">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://sampritibotanicals.com/contact.html">
    <meta property="og:title" content="Contact Us - Sampriti Botanicals">
    <meta property="og:description"
        content="Contact Sampriti Botanicals. Get in touch with us for inquiries about our sacred Indian herbal formulations.">
    <meta property="og:image" content="http://sampritibotanicals.com/assets/images/brand2.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="http://sampritibotanicals.com/contact.html">
    <meta property="twitter:title" content="Contact Us - Sampriti Botanicals">
    <meta property="twitter:description"
        content="Contact Sampriti Botanicals. Get in touch with us for inquiries about our sacred Indian herbal formulations.">
    <meta property="twitter:image" content="http://sampritibotanicals.com/assets/images/brand2.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Tenor+Sans&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/logo-trans-text.png" alt="Sampriti Logo">

            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html#about">ABOUT</a></li>
                    <li><a href="index.html#products">SHOP</a></li>
                    <li><a href="/blog">BLOG</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contact" class="section-padding">
            <div class="container">
                <div class="section-header text-center">
                    <span class="eyebrow">Get in Touch</span>
                    <h2>Contact Us</h2>
                </div>
                <div class="contact-content text-center max-width-800" style="margin: 0 auto;">
                    <div class="contact-card"
                        style="background: #fdfbfb; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
                        <div style="margin-bottom: 30px;">
                            <h3 style="font-size: 1.5rem; margin-bottom: 15px;">Address</h3>
                            <p style="font-size: 1.1rem; line-height: 1.8;">
                                <strong>Sampriti</strong><br>
                                Chez nous Maitreya<br>
                                Ami Road<br>
                                Near Sun Farm<br>
                                Auroville 605101<br>
                                Tamil Nadu
                            </p>
                        </div>

                        <div>
                            <h3 style="font-size: 1.5rem; margin-bottom: 15px;">Email</h3>
                            <p style="font-size: 1.1rem;">
                                <a href="mailto:sampritibotanicals@gmail.com"
                                    style="color: var(--primary-color-1); font-weight: 600;">sampritibotanicals@gmail.com</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <a href="index.html" class="logo">
                        <img src="assets/images/logo-trans-text.png" alt="Sampriti" style="max-width: 150px;">

                    </a>
                </div>
                <div class="footer-links">
                    <a href="index.html#about">About</a>
                    <a href="index.html#products">Shop</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Sampriti. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <div id="buy-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Complete Your Order</h2>
            <p id="modal-product-name"></p>
            <form id="buy-form">
                <input type="hidden" id="product-name" name="product-name">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="address">Shipping Address</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary full-width">Place Order</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
